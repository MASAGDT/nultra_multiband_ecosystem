[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nultra-multiband-ecosystem"
version = "1.0.0"
description = "Canonical Version 1.0 of the Nultra Multiband Ecosystem audio processor."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Eric" }
]
dependencies = [
  "numpy",
  "scipy",
  "numba",
]
keywords = [
  "audio",
  "dsp",
  "wav",
  "multiband",
  "numba",
  "signal-processing",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
nultra-process = "nultra_multiband_ecosystem.processor:main"
nultra-menu = "nultra_multiband_ecosystem.menu:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
